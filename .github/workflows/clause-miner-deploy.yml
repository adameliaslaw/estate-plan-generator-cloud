name: Clause-miner deploy

# Deploys the clause-mining Cloud Run Job (docs/CLAUSE-MINING-PIPELINE.md
# §2, §11 P0.4): builds the clause-miner/ Docker image, pushes it to
# Artifact Registry, and `gcloud run jobs deploy`s it.
#
# workflow_dispatch ONLY — no push triggers. The pipeline is spend-gated and
# stage-driven; a deploy is an explicit operator action, never a side effect
# of a merge. (This also keeps the ~1.4 GB LibreOffice image build off the
# hot CI path.)
#
# Auth mirrors .github/workflows/firebase-functions-deploy.yml: the SAME
# GitHub secret (FIREBASE_SERVICE_ACCOUNT_EPG) via google-github-actions/auth.
# The Job itself runs as the project's default compute service account
# (gcloud run jobs deploy default when --service-account is omitted), so the
# existing drive.readonly grant, Vertex access, and Secret Manager mounts
# carry over per §2 "Runs-where summary".
#
# The Job needs its env contract set at deploy time (clause-miner/README.md)
# and a way to be EXECUTED, or a deploy leaves something nobody can run
# without a local gcloud. Both are dispatch inputs below. `stage` defaults to
# the read-only preflight (§11 P0.1) because that is the only stage safe to
# run before the Drive grant is confirmed — it makes no LLM calls, spends
# nothing, and writes nothing to Drive.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to execute after deploying (deploy-only = build and deploy, run nothing)'
        type: choice
        default: preflight
        options:
          - preflight
          - deploy-only
          - manifest
          - seed
          - calibrate
          - convert
          - triage
          - extract
          - segment
          - identity
          - canonicalize
          - stats
          - catalog
          - gates
      firm_id:
        description: 'FIRM_ID — Firestore scope firms/{firmId}/…'
        type: string
        required: true
      run_id:
        description: 'RUN_ID — run ledger id (reuse one to RESUME that run)'
        type: string
        required: true
      gcs_bucket:
        description: 'GCS_BUCKET for converted/text artifacts'
        type: string
        required: true
      sample_limit:
        description: 'SAMPLE_LIMIT — stratified calibration sample size (blank = whole corpus)'
        type: string
        default: ''
      seed_folder_ids:
        description: 'CLAUSE_MINER_SEED_FOLDER_IDS — curated-library folder ids (comma separated). Run preflight first to discover them.'
        type: string
        default: ''
      canary_folder_ids:
        description: 'CLAUSE_MINER_CANARY_FOLDER_IDS — held-out Gate 4 folder ids (must be a subset of the seed ids)'
        type: string
        default: ''
      mount_anthropic_secret:
        description: 'Mount ANTHROPIC_API_KEY from Secret Manager (required by the LLM stages; leave off for preflight/manifest/convert)'
        type: boolean
        default: false

concurrency:
  group: clause-miner-deploy
  cancel-in-progress: false

env:
  PROJECT: estate-plan-generator
  REGION: us-east1
  AR_REPO: clause-miner
  JOB_NAME: clause-miner
  # The corpus root, kept identical to functions/src/wills-backfill.ts
  # DRIVE_ROOT_FOLDER_ID so both pipelines walk one corpus under one grant.
  ROOT_FOLDER_ID: 1TuJOw7hy4xKm6EJeyFb5IYS4I6eoVk-j

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPG }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: estate-plan-generator

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Report EVERY missing permission at once. Without this the run fails on
      # the first one, and each round trip is human-gated in a cloud console —
      # three sequential failures is three interruptions for one setup task.
      - name: Check deploy permissions and APIs
        run: |
          set -uo pipefail
          PROBLEMS=""

          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)' 2>/dev/null || true)

          WANT="artifactregistry.repositories.create,artifactregistry.repositories.get,artifactregistry.repositories.uploadArtifacts,run.jobs.create,run.jobs.get,run.jobs.run,run.jobs.update"
          HAVE=$(gcloud projects test-iam-permissions "$PROJECT" --permissions="$WANT" --format='value(permissions)' 2>/dev/null | tr '\n' ' ' || true)

          for perm in $(echo "$WANT" | tr ',' ' '); do
            case " $HAVE " in
              *" $perm "*) ;;
              *) PROBLEMS="${PROBLEMS}\n  MISSING PERMISSION: ${perm}" ;;
            esac
          done

          # actAs lives on the runtime service account, not the project, so it
          # needs its own check — a project-level test would report it missing
          # even when it is granted correctly on the account itself.
          if [ -n "$PROJECT_NUMBER" ]; then
            RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
            ACTAS=$(gcloud iam service-accounts test-iam-permissions "$RUNTIME_SA" \
              --permissions=iam.serviceAccounts.actAs --format='value(permissions)' 2>/dev/null || true)
            if [ -z "$ACTAS" ]; then
              PROBLEMS="${PROBLEMS}\n  MISSING PERMISSION: iam.serviceAccounts.actAs on ${RUNTIME_SA}"
            fi
          fi

          ENABLED=$(gcloud services list --enabled --format='value(config.name)' 2>/dev/null || true)
          for api in artifactregistry.googleapis.com run.googleapis.com; do
            case "$ENABLED" in
              *"$api"*) ;;
              *) PROBLEMS="${PROBLEMS}\n  API NOT ENABLED: ${api}" ;;
            esac
          done

          if [ -n "$PROBLEMS" ]; then
            echo "════════════════════════════════════════════════════════════"
            echo " CLAUSE-MINER DEPLOY — SETUP INCOMPLETE"
            echo "════════════════════════════════════════════════════════════"
            echo "Deploying as: $(gcloud config get-value account 2>/dev/null)"
            printf '%b\n' "$PROBLEMS"
            echo ""
            echo "Grant these roles to the deploying service account"
            echo "(Cloud Console -> IAM & Admin -> IAM -> edit that principal):"
            echo "  - Artifact Registry Administrator  (artifactregistry.* above)"
            echo "  - Cloud Run Admin                  (run.jobs.* above)"
            echo "  - Service Account User             (iam.serviceAccounts.actAs)"
            echo "Enable any API listed above under APIs & Services."
            echo "════════════════════════════════════════════════════════════"
            exit 1
          fi
          echo "Permissions and APIs OK."


      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "$AR_REPO" \
            --project "$PROJECT" --location "$REGION" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "$AR_REPO" \
            --project "$PROJECT" --location "$REGION" \
            --repository-format=docker \
            --description="Clause-mining pipeline Cloud Run Job images"

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/${JOB_NAME}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" clause-miner
          docker push "$IMAGE"

      # 4 CPU / 8 Gi and a 6 h task timeout per the spec: 4 conversion
      # workers (§8 throughput math) inside a multi-hour batch envelope.
      # --max-retries 0: stages checkpoint per-file to Firestore (§3) and are
      # resumed by re-execution, not blind retry.
      - name: Deploy Cloud Run Job
        env:
          IN_STAGE: ${{ inputs.stage }}
          IN_FIRM_ID: ${{ inputs.firm_id }}
          IN_RUN_ID: ${{ inputs.run_id }}
          IN_GCS_BUCKET: ${{ inputs.gcs_bucket }}
          IN_SAMPLE_LIMIT: ${{ inputs.sample_limit }}
          IN_SEED_IDS: ${{ inputs.seed_folder_ids }}
          IN_CANARY_IDS: ${{ inputs.canary_folder_ids }}
          IN_MOUNT_SECRET: ${{ inputs.mount_anthropic_secret }}
        run: |
          set -euo pipefail
          # STAGE is baked in at deploy so an execution is a pure re-run of a
          # known configuration — no per-execution overrides to reconstruct
          # when diagnosing what a run actually did.
          STAGE_ENV="$IN_STAGE"
          if [ "$STAGE_ENV" = "deploy-only" ]; then STAGE_ENV="preflight"; fi

          # Comma-separated id lists collide with gcloud's default delimiter,
          # so the whole set is passed with the ^@^ alternate-delimiter form.
          # Empty values are fine: env.ts treats blank as unset.
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$PROJECT" \
            --region "$REGION" \
            --cpu 4 \
            --memory 8Gi \
            --task-timeout 21600 \
            --tasks 1 \
            --max-retries 0 \
            --set-env-vars "^@^STAGE=${STAGE_ENV}@FIRM_ID=${IN_FIRM_ID}@RUN_ID=${IN_RUN_ID}@GCS_BUCKET=${IN_GCS_BUCKET}@CLAUSE_MINER_ROOT_FOLDER_ID=${ROOT_FOLDER_ID}@SAMPLE_LIMIT=${IN_SAMPLE_LIMIT}@CLAUSE_MINER_SEED_FOLDER_IDS=${IN_SEED_IDS}@CLAUSE_MINER_CANARY_FOLDER_IDS=${IN_CANARY_IDS}"

          if [ "$IN_MOUNT_SECRET" = "true" ]; then
            gcloud run jobs update "$JOB_NAME" \
              --project "$PROJECT" --region "$REGION" \
              --set-secrets "ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest"
          fi

      # Executing is opt-in per dispatch. `deploy-only` stops here, which is
      # the escape hatch if a deploy needs to land without touching Drive.
      - name: Execute stage
        if: ${{ inputs.stage != 'deploy-only' }}
        env:
          IN_STAGE: ${{ inputs.stage }}
        run: |
          set -uo pipefail
          echo "Executing stage '${IN_STAGE}' …"
          gcloud run jobs execute "$JOB_NAME" \
            --project "$PROJECT" --region "$REGION" --wait
          EXEC_STATUS=$?

          # The execution name is read back from the API rather than from the
          # execute command's stdout. On the failure path gcloud prints
          # nothing to stdout, so capturing it there yielded an empty name and
          # skipped the log fetch — losing the report on precisely the runs
          # that need one. Listing works on both paths.
          EXECUTION=$(gcloud run jobs executions list \
            --job "$JOB_NAME" --project "$PROJECT" --region "$REGION" \
            --limit 1 --sort-by '~metadata.creationTimestamp' \
            --format 'value(metadata.name)' 2>/dev/null)
          echo "execution: ${EXECUTION:-<none>} (execute exit ${EXEC_STATUS})"

          # The Job's own stdout IS the report, and it is fetched whether the
          # execution passed or failed: a preflight that reports BLOCKED exits
          # non-zero on purpose, so a non-zero execution is a result to read,
          # not only an error to raise.
          if [ -n "${EXECUTION:-}" ]; then
            echo "──────── job output ────────"
            gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND labels.\"run.googleapis.com/execution_name\"=${EXECUTION}" \
              --project "$PROJECT" --limit 1000 --order asc --freshness 2h \
              --format 'value(textPayload)' || echo '(could not read logs)'
            echo "────────────────────────────"
          else
            echo "Could not determine the execution name; read it in Cloud Console."
          fi
          exit $EXEC_STATUS
