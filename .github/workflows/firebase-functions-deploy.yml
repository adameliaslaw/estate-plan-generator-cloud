name: Firebase Functions deploy

# Auto-deploys Cloud Functions to `estate-plan-generator` every time main
# is pushed with functions changes. Replaces the manual
# `firebase deploy --only functions` step that requires
# adam@adameliaslaw.com locally (info@adamelias.ai lacks
# `iam.serviceAccounts.ActAs`).
#
# Uses the SAME GitHub secret as the hosting workflow
# (FIREBASE_SERVICE_ACCOUNT_EPG) — no extra setup needed if hosting CI
# is already wired up.
#
# Firebase will pick up Secret Manager values automatically at deploy
# time (ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, PERPLEXITY_API_KEY,
# SENDGRID_API_KEY, etc.). The CI
# service account needs `roles/secretmanager.secretAccessor` — Firebase's
# default-generated key includes this via `roles/firebase.admin`.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-functions-deploy.yml'
      - '.github/scripts/deploy-functions.sh'
  # Manual trigger for ad-hoc deploys (e.g. after rotating a secret)
  workflow_dispatch:

# Cancel in-flight deploys when a newer commit arrives
concurrency:
  group: functions-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 60 min: a normal push converges in one full deploy (Phase 1, ~5 min), but
    # the first run after a shared-module change (or this rework) needs the
    # chunked storm-recovery path below (Phase 2/3) to converge ~80 functions in
    # ≤5-at-a-time batches, on top of build/test/lint (~8 min).
    timeout-minutes: 60
    # contents:read for checkout; issues:write so the failure handler below can
    # open/append a GitHub issue. Deploy auth is via google-github-actions/auth
    # (a SA key), NOT GITHUB_TOKEN, so this restriction doesn't affect the deploy.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies (frozen lockfile)
        working-directory: functions
        run: npm ci

      - name: Type-check + build
        working-directory: functions
        run: npm run build

      # functions-backfill is a second codebase with its own pinned TypeScript.
      # `firebase deploy` runs its predeploy build (npm run build -> tsc) but
      # does NOT install its deps. Without this, tsc resolves to an ambient
      # newer TypeScript that errors on moduleResolution=node10 (TS5107).
      # Installing the locked deps pins it to the same TS as local builds.
      - name: Install functions-backfill dependencies (frozen lockfile)
        working-directory: functions-backfill
        run: npm ci

      # Gate the deploy on the root test suite — it covers the security-rules
      # text, the client-data serializer, and template formatting, so a rules
      # or generator regression aborts the deploy before it ships. The suite
      # needs root deps (vitest/jsdom) on top of the functions deps installed
      # above for the tests that import functions/src.
      - name: Install root dependencies (for the test suite)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPG }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Deploy functions + security rules
        # `google-github-actions/auth@v3` sets GOOGLE_APPLICATION_CREDENTIALS
        # automatically for subsequent steps; firebase-tools picks it up (so
        # `firebase functions:list` in Phase 2 is authed without gcloud).
        # firestore:rules and storage are included (Phase 1) because no other
        # workflow deploys them. Storage was provisioned 2026-06-16 (defaultBucket
        # registered). The CI deployer SA initially still failed the storage
        # setup-check with "Firebase Storage has not been set up": its
        # `defaultBucket` GET returned 404 (not 403) because the SA had only the
        # narrow firebase*.admin roles and lacked `firebase.projects.get`, which
        # firebasestorage needs to resolve the defaultBucket. Fixed by granting
        # the SA `roles/firebase.viewer` (read-only) — verified the GET flips
        # 404->200 under SA impersonation. storage.rules now auto-deploys in CI.
        #
        # CHUNKED STORM-RECOVERY DEPLOY (reworked 2026-06-30; supersedes the
        # 2026-06-29 retry-the-full-deploy loop, which could not converge). A
        # shared-module change makes Firebase deploy ~80 functions at once,
        # exceeding the Cloud Functions v2 concurrent-op ceiling → many updates
        # fail with HTTP 409 "unable to queue the operation". `firebase deploy`
        # logs these as WARNINGS and still EXITS 0, so CI once reported green
        # while ~36 functions silently stayed on old code (stranding T6/T7/AR/T8/
        # #62 — found when a SendGrid smoke test failed). Retrying the *full*
        # deploy plateaus (the op-queue keeps cascading), but small batches (≤5)
        # succeed 100%. So: Phase 1 attempts one full deploy (fast for a normal
        # few-function push, and the only place rules deploy); if it doesn't
        # converge, Phase 2 redeploys the default codebase in ≤5-function chunks
        # (converged functions are no-ops; only stragglers do real work); Phase 3
        # does a final full deploy as the authoritative pass/fail gate (catches
        # brand-new + deleted functions). A non-converged Phase 3 FAILS the job,
        # tripping the "Notify on failure" issue below.
        run: bash .github/scripts/deploy-functions.sh

      # Surface CI/deploy failures that would otherwise go unnoticed — commits
      # here are authored by "AI Bot", so GitHub's default failure email doesn't
      # reach Adam (this caused a 4-day silent deploy outage in June 2026).
      # Opens a GitHub issue assigned to Adam on ANY failed step (lint/test/
      # build/deploy); appends to the existing open issue instead of duplicating.
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const wf = context.workflow;
            const sha = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 CI failing: ${wf}`;
            const body = `**${wf}** failed on \`${sha}\` (${context.eventName}).\n\nRun: ${runUrl}\n\nThe deploy did not complete — functions/rules may be stale until this is fixed.`;
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, assignees: ['adameliaslaw'] });
            }
