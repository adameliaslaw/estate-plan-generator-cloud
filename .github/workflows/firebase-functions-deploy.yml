name: Firebase Functions deploy

# Auto-deploys Cloud Functions to `estate-plan-generator` every time main
# is pushed with functions changes. Replaces the manual
# `firebase deploy --only functions` step that requires
# adam@adameliaslaw.com locally (info@adamelias.ai lacks
# `iam.serviceAccounts.ActAs`).
#
# Uses the SAME GitHub secret as the hosting workflow
# (FIREBASE_SERVICE_ACCOUNT_EPG) — no extra setup needed if hosting CI
# is already wired up.
#
# Firebase will pick up Secret Manager values automatically at deploy
# time (ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, PERPLEXITY_API_KEY,
# SENDGRID_API_KEY, etc.). The CI
# service account needs `roles/secretmanager.secretAccessor` — Firebase's
# default-generated key includes this via `roles/firebase.admin`.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-functions-deploy.yml'
  # Manual trigger for ad-hoc deploys (e.g. after rotating a secret)
  workflow_dispatch:

# QUEUE (never cancel) deploys. Cancelling a run mid-deploy does NOT stop the
# GCP operations it already started — on 2026-06-30 cancelled runs left orphaned
# in-flight ops that 409-poisoned every subsequent deploy for hours. With
# cancel-in-progress:false a newer push waits for the running deploy to finish;
# GitHub keeps only the newest PENDING run per group (superseded pending runs
# are dropped before they start any GCP work — harmless).
concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 5.5h headroom for the ONE-TIME full convergence: when every function is
    # churned (local-build vs CI-build hash mismatch), all ~80 deploy in batches
    # of 5, and each batch waits for the previous batch's LROs to fully finalize
    # (not just serve ACTIVE) before starting — worst case ~9 min/batch × 16
    # batches ≈ 2.5-3h. Normal pushes change a few functions → batches skip the
    # unchanged ones and the ops-drain returns instantly (0 in-flight) → fast.
    # The high ceiling only costs wall-clock on the rare full-convergence run.
    timeout-minutes: 330
    # contents:read for checkout; issues:write so the failure handler below can
    # open/append a GitHub issue. Deploy auth is via google-github-actions/auth
    # (a SA key), NOT GITHUB_TOKEN, so this restriction doesn't affect the deploy.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies (frozen lockfile)
        working-directory: functions
        run: npm ci

      - name: Type-check + build
        working-directory: functions
        run: npm run build

      # functions-backfill is a second codebase with its own pinned TypeScript.
      # `firebase deploy` runs its predeploy build (npm run build -> tsc) but
      # does NOT install its deps. Without this, tsc resolves to an ambient
      # newer TypeScript that errors on moduleResolution=node10 (TS5107).
      # Installing the locked deps pins it to the same TS as local builds.
      - name: Install functions-backfill dependencies (frozen lockfile)
        working-directory: functions-backfill
        run: npm ci

      # Gate the deploy on the root test suite — it covers the security-rules
      # text, the client-data serializer, and template formatting, so a rules
      # or generator regression aborts the deploy before it ships. The suite
      # needs root deps (vitest/jsdom) on top of the functions deps installed
      # above for the tests that import functions/src.
      - name: Install root dependencies (for the test suite)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPG }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Deploy functions + security rules
        # `google-github-actions/auth@v3` sets GOOGLE_APPLICATION_CREDENTIALS
        # automatically for subsequent steps; firebase-tools picks it up.
        # firestore:rules and storage are included because no other workflow
        # deploys them. Storage was provisioned 2026-06-16 (defaultBucket
        # registered). The CI deployer SA initially still failed the storage
        # setup-check with "Firebase Storage has not been set up": its
        # `defaultBucket` GET returned 404 (not 403) because the SA had only the
        # narrow firebase*.admin roles and lacked `firebase.projects.get`, which
        # firebasestorage needs to resolve the defaultBucket. Fixed by granting
        # the SA `roles/firebase.viewer` (read-only) — verified the GET flips
        # 404->200 under SA impersonation. storage.rules now auto-deploys in CI.
        #
        # CHUNKED DEPLOY WITH OP-QUEUE DRAIN (2026-06-30). A single
        # `firebase deploy --only functions` of ~80 Cloud Functions v2 deploys
        # them all at once, exceeding the v2 concurrent-op ceiling → updates fail
        # with HTTP 409 "unable to queue the operation". `firebase deploy` logs
        # those as WARNINGS and still EXITS 0, so CI used to report green while
        # ~36 functions silently stayed on old code (stranding T6/T7/AR/T8/#62 —
        # found when a SendGrid smoke test failed). Re-running the *full* deploy
        # never converged (the op-queue cascades).
        #
        # The first chunked rework (#65) deployed in batches of 5 but fired them
        # back-to-back, so each batch 409'd within ~3s — the PREVIOUS batch's
        # operations were still in flight on the region's op-queue (its run timed
        # out at 60 min, converging only ~22 of 80). The second rework (#69)
        # paced batches with a drain() that polled `firebase functions:list`
        # until every function showed ACTIVE — still 409'd, because a v2 update
        # operation keeps FINALIZING for minutes after the function already
        # serves ACTIVE (confirmed from the 2026-06-30 run logs). Manual
        # convergence only ever worked because humans paced batches minutes
        # apart — i.e. past the invisible finalization tail.
        #
        # So drain() now polls the ACTUAL long-running operations
        # (cloudfunctions.googleapis.com/v2 .../operations?filter=done=false)
        # until ZERO are in flight, via gcloud print-access-token + curl
        # (gcloud is preinstalled on ubuntu-latest; the SA key from auth@v3 is
        # activated below — print-access-token re-mints, so no 1h-token expiry
        # on a long convergence run). If the ops query is unavailable
        # (permission/API change), drain falls back to the old ACTIVE-state
        # poll — no worse than #69; the per-batch retries absorb any 409s.
        # Now:
        #   1. deploy firestore:rules + storage once,
        #   2. redeploy the deployed default-codebase functions in batches of 5,
        #      draining the op-queue (LRO done) before every batch + retry,
        #   3. run a final full `firebase deploy --only functions` — catches
        #      brand-new functions and deletes removed ones; everything converged
        #      in step 2 is unchanged → skipped → no storm. This final deploy is
        #      the authoritative gate: we FAIL the job on any per-function
        #      failure, which trips the "Notify on failure" issue below.
        # Enumeration still uses `firebase functions:list` (authed via
        # GOOGLE_APPLICATION_CREDENTIALS).
        run: |
          # GitHub runs this with `bash -e`; disable errexit so a failing deploy
          # attempt doesn't abort before we read its exit code and retry.
          set +e -uo pipefail
          PROJECT=estate-plan-generator
          REGION=us-east1
          CHUNK_SIZE=5
          RUNNER_TEMP="${RUNNER_TEMP:-/tmp}"
          FAIL_RE='failed to (update|create) function|unable to queue the operation'

          # Small node helpers, written to files to avoid inline-quoting hell.
          # count-busy: number of functions NOT in ACTIVE state (fallback drain).
          cat > "$RUNNER_TEMP/count-busy.js" <<'JS'
          let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s).result||[];process.stdout.write(String(r.filter(f=>f.state&&f.state!=='ACTIVE').length));}catch(e){process.stdout.write('ERR');}});
          JS
          # count-inflight: number of not-done LROs in a v2 ListOperationsResponse.
          cat > "$RUNNER_TEMP/count-inflight.js" <<'JS'
          let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const o=JSON.parse(s).operations||[];process.stdout.write(String(o.filter(op=>op.done!==true).length));}catch(e){process.stdout.write('ERR');}});
          JS
          # list-default: ids of the `default`-codebase functions, one per line.
          cat > "$RUNNER_TEMP/list-default.js" <<'JS'
          let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s).result||[];for(const f of r){if(f.codebase==='default'&&f.id)console.log(f.id);}}catch(e){}});
          JS

          # gcloud (preinstalled on ubuntu-latest) mints the access tokens for
          # the ops-drain; auth@v3 already wrote the SA key file.
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet \
            || echo "⚠️ gcloud activation failed — drain will use the state-based fallback."

          # Count of in-flight (done=false) Cloud Functions v2 LROs, or ERR.
          # An empty ListOperationsResponse {} parses to 0 (all done).
          inflight_ops() {
            local token
            token=$(gcloud auth print-access-token 2>/dev/null) || { echo ERR; return; }
            curl -sf -m 30 -H "Authorization: Bearer $token" \
              "https://cloudfunctions.googleapis.com/v2/projects/$PROJECT/locations/$REGION/operations?filter=done%3Dfalse&pageSize=100" \
              | node "$RUNNER_TEMP/count-inflight.js"
          }

          # Wait until the regional v2 op-queue has drained so the next batch
          # doesn't 409. Primary signal: ZERO in-flight LROs — this catches the
          # minutes-long finalization tail AFTER a function already serves
          # ACTIVE (the gap that broke the #69 state-based drain). Fallback on
          # ops-query failure: the old ACTIVE-state poll. Both cap and then
          # proceed anyway (the deploy retries absorb a 409 if a cap was short).
          drain() {
            local waited=0 max=900 ops busy
            while [ "$waited" -lt "$max" ]; do
              ops=$(inflight_ops)
              if [ "$ops" = "ERR" ] || [ -z "$ops" ]; then
                sleep 5
                ops=$(inflight_ops)   # one retry — transient token/API hiccup
              fi
              if [ "$ops" = "ERR" ] || [ -z "$ops" ]; then
                echo "   ⚠️ operations API unavailable — falling back to ACTIVE-state drain."
                break
              fi
              if [ "$ops" = "0" ]; then
                [ "$waited" -gt 0 ] && echo "   op-queue drained after ${waited}s."
                return 0
              fi
              echo "   draining op-queue: $ops operation(s) still in flight (${waited}s)…"
              sleep 20; waited=$((waited + 20))
            done
            if [ "$waited" -ge "$max" ]; then
              echo "   ⚠️ drain cap (${max}s) reached; proceeding anyway."
              return 0
            fi
            # Fallback: state-based poll (pre-LRO behavior — better than nothing).
            waited=0; max=360
            while [ "$waited" -lt "$max" ]; do
              busy=$(firebase functions:list --project "$PROJECT" --json 2>/dev/null \
                | node "$RUNNER_TEMP/count-busy.js")
              if [ "$busy" = "0" ]; then
                [ "$waited" -gt 0 ] && echo "   op-queue drained (state-based) after ${waited}s."
                return 0
              fi
              [ "$busy" = "ERR" ] || [ -z "$busy" ] && busy="?"
              echo "   draining (state-based): $busy function(s) still deploying (${waited}s)…"
              sleep 20; waited=$((waited + 20))
            done
            echo "   ⚠️ state-drain cap (${max}s) reached; proceeding anyway."
            return 0
          }

          # Deploy a set of --only targets, draining the op-queue before each
          # attempt so batches don't 409-cascade. Converged = exit 0 AND zero
          # per-function failure lines. Non-zero if it can't converge in $tries.
          deploy_with_retry() {
            local label="$1" targets="$2" tries="$3" i=1 code fails
            while [ "$i" -le "$tries" ]; do
              drain
              echo "::group::deploy $label — attempt $i/$tries"
              firebase deploy --only "$targets" \
                --project "$PROJECT" --non-interactive --force 2>&1 | tee "deploy-$label-$i.log"
              code=${PIPESTATUS[0]}
              echo "::endgroup::"
              fails=$(grep -ciE "$FAIL_RE" "deploy-$label-$i.log" || true)
              if [ "$code" -eq 0 ] && [ "$fails" -eq 0 ]; then
                echo "✅ $label converged on attempt $i."
                return 0
              fi
              echo "⚠️ $label attempt $i did not converge (firebase exit=$code, per-function failures=$fails)."
              i=$((i + 1))
              [ "$i" -le "$tries" ] && { echo "Retrying after drain…"; sleep 20; }
            done
            return 1
          }

          # 1. Rules first — independent of the function op-queue.
          deploy_with_retry "rules" "firestore:rules,storage" 3 || {
            echo "❌ firestore:rules / storage failed to deploy."; exit 1; }

          # 2. Redeploy every deployed default-codebase function in small batches.
          #    (The 3 dormant backfill-codebase jobs are left to the final deploy.)
          mapfile -t FUNCS < <(firebase functions:list --project "$PROJECT" --json 2>/dev/null \
            | node "$RUNNER_TEMP/list-default.js" | sort -u)
          echo "Discovered ${#FUNCS[@]} default-codebase functions; converging in batches of $CHUNK_SIZE."
          if [ "${#FUNCS[@]}" -eq 0 ]; then
            echo "⚠️ Enumeration returned 0 functions — skipping batches, relying on the final full deploy."
          fi
          batch_warned=0
          i=0
          while [ "$i" -lt "${#FUNCS[@]}" ]; do
            chunk=("${FUNCS[@]:i:CHUNK_SIZE}")
            targets=$(printf 'functions:default:%s,' "${chunk[@]}"); targets=${targets%,}
            n=$((i / CHUNK_SIZE + 1))
            echo "Batch $n: ${chunk[*]}"
            deploy_with_retry "batch-$n" "$targets" 3 || {
              echo "⚠️ Batch $n did not converge after retries — the final full deploy will pick up its stragglers."
              batch_warned=1; }
            i=$((i + CHUNK_SIZE))
          done

          # 3. Final full deploy — catches new functions, deletes removed ones,
          #    and is the authoritative convergence gate. After step 2 the
          #    existing functions are unchanged (same build) → skipped → no storm.
          deploy_with_retry "final" "functions,firestore:rules,storage" 5 || {
            echo "❌ Final full deploy did NOT converge — functions may be stale. Failing the job."
            echo "   Re-run this workflow, or small-batch deploy the stragglers locally:"
            echo "   firebase deploy --only functions:default:a,functions:default:b (≤5 at a time)."
            exit 1; }

          if [ "$batch_warned" -ne 0 ]; then
            echo "ℹ️ One or more batches needed the final deploy to converge, but the final"
            echo "   deploy reported 0 per-function failures, so prod is current."
          fi
          echo "✅ Functions + rules fully converged."
          exit 0

      # Surface CI/deploy failures that would otherwise go unnoticed — commits
      # here are authored by "AI Bot", so GitHub's default failure email doesn't
      # reach Adam (this caused a 4-day silent deploy outage in June 2026).
      # Opens a GitHub issue assigned to Adam on ANY failed step (lint/test/
      # build/deploy); appends to the existing open issue instead of duplicating.
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const wf = context.workflow;
            const sha = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 CI failing: ${wf}`;
            const body = `**${wf}** failed on \`${sha}\` (${context.eventName}).\n\nRun: ${runUrl}\n\nThe deploy did not complete — functions/rules may be stale until this is fixed.`;
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, assignees: ['adameliaslaw'] });
            }
