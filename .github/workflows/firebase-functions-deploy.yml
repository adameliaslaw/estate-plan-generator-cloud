name: Firebase Functions deploy

# Auto-deploys Cloud Functions to `estate-plan-generator` every time main
# is pushed with functions changes. Replaces the manual
# `firebase deploy --only functions` step that requires
# adam@adameliaslaw.com locally (info@adamelias.ai lacks
# `iam.serviceAccounts.ActAs`).
#
# Uses the SAME GitHub secret as the hosting workflow
# (FIREBASE_SERVICE_ACCOUNT_EPG) — no extra setup needed if hosting CI
# is already wired up.
#
# Firebase will pick up Secret Manager values automatically at deploy
# time (ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, PERPLEXITY_API_KEY,
# SENDGRID_API_KEY, etc.). The CI
# service account needs `roles/secretmanager.secretAccessor` — Firebase's
# default-generated key includes this via `roles/firebase.admin`.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      # Without this trigger an index-only commit deploys NOTHING — verified
      # gap found in the clause-mining design review (#220 §9). Indexes are
      # deployed alongside rules in the deploy step below.
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-functions-deploy.yml'
  # Manual trigger for ad-hoc deploys (e.g. after rotating a secret)
  workflow_dispatch:

# QUEUE (never cancel) deploys. Cancelling a run mid-deploy does NOT stop the
# GCP operations it already started — on 2026-06-30 cancelled runs left orphaned
# in-flight ops that 409-poisoned every subsequent deploy for hours. With
# cancel-in-progress:false a newer push waits for the running deploy to finish;
# GitHub keeps only the newest PENDING run per group (superseded pending runs
# are dropped before they start any GCP work — harmless).
concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Post-#64 simplification the deploy is: one full `firebase deploy` (all 80
    # sent in parallel, ~15-25 min even on a full-convergence run) + the
    # straggler pass (≤5 losers, 6 tries × ~4 min ≈ 24 min worst case). Realistic
    # worst case ~50 min; 120 gives ~2× headroom without masking a genuinely
    # stuck deploy. (Was 330 for the removed 16-batch serial convergence.)
    timeout-minutes: 120
    # contents:read for checkout; issues:write so the failure handler below can
    # open/append a GitHub issue. Deploy auth is via google-github-actions/auth
    # (a SA key), NOT GITHUB_TOKEN, so this restriction doesn't affect the deploy.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies (frozen lockfile)
        working-directory: functions
        run: npm ci

      - name: Type-check + build
        working-directory: functions
        run: npm run build

      # functions-backfill is a second codebase with its own pinned TypeScript.
      # `firebase deploy` runs its predeploy build (npm run build -> tsc) but
      # does NOT install its deps. Without this, tsc resolves to an ambient
      # newer TypeScript that errors on moduleResolution=node10 (TS5107).
      # Installing the locked deps pins it to the same TS as local builds.
      - name: Install functions-backfill dependencies (frozen lockfile)
        working-directory: functions-backfill
        run: npm ci

      # Gate the deploy on the root test suite — it covers the security-rules
      # text, the client-data serializer, and template formatting, so a rules
      # or generator regression aborts the deploy before it ships. The suite
      # needs root deps (vitest/jsdom) on top of the functions deps installed
      # above for the tests that import functions/src.
      - name: Install root dependencies (for the test suite)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      # Emulator-backed integration tests (tests/emulator/**) — exercise the
      # REAL functions/src admin-SDK code and the live firestore.rules engine
      # against local Firestore + Auth emulators (no GCP auth; demo project).
      # Kept out of `npm run test` so the unit pass stays hermetic; gated here
      # so a regression in the transactional save path, callable firm-scoping,
      # or the rules themselves aborts the deploy. The Firestore emulator needs
      # a JRE (firebase-tools 15.x requires Java 21+); firebase-tools is
      # installed before this step (it also serves the deploy steps below).
      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase emulator jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Run emulator integration tests
        run: npm run test:emulator

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPG }}

      - name: Deploy functions + security rules
        # `google-github-actions/auth@v3` sets GOOGLE_APPLICATION_CREDENTIALS
        # automatically for subsequent steps; firebase-tools picks it up.
        # firestore:rules and storage are included because no other workflow
        # deploys them. Storage was provisioned 2026-06-16 (defaultBucket
        # registered). The CI deployer SA initially still failed the storage
        # setup-check with "Firebase Storage has not been set up": its
        # `defaultBucket` GET returned 404 (not 403) because the SA had only the
        # narrow firebase*.admin roles and lacked `firebase.projects.get`, which
        # firebasestorage needs to resolve the defaultBucket. Fixed by granting
        # the SA `roles/firebase.viewer` (read-only) — verified the GET flips
        # 404->200 under SA impersonation. storage.rules now auto-deploys in CI.
        #
        # DEPLOY STRATEGY (simplified 2026-07-09, issue #64).
        # firebase computes ONE content-hash for the whole `functions/` codebase
        # and stamps it onto every function (verified in firebase-tools 15.x:
        # cache/applyHash.js applyBackendHashToEndpoints + prepareFunctionsUpload.js
        # line 124 — sha1 of every file's CONTENT, sorted; mtimes/archive order
        # are NOT hashed). So any source change marks all ~80 functions changed
        # and a normal merge redeploys the whole codebase. That fan-out is
        # intrinsic to a single codebase; the only lever CI has is HOW it pushes
        # those 80.
        #
        # History: one `firebase deploy --only functions` sends all 80 in
        # parallel. On a CLEAN regional op-queue that leaves EXACTLY ONE random
        # 409 straggler (empirical, runs #95-97, 2026-07-02); the "storm" seen on
        # 2026-06-30 was a queue poisoned by orphaned ops from CANCELLED runs
        # (fixed separately by concurrency: cancel-in-progress:false above). The
        # earlier fix instead redeployed all 80 in serialized batches of 5 with
        # an op-queue drain between each — safe but ~16 drains = 50-80 min/merge.
        #
        # This version drops that batch loop: deploy rules, then ONE full
        # functions deploy, then converge the ~1 straggler individually (single-
        # function deploys don't hit the burst 409). Safety nets kept intact:
        #   - drain() polls the ACTUAL long-running operations
        #     (cloudfunctions.googleapis.com/v2 .../operations?filter=done=false)
        #     to ZERO in-flight via gcloud print-access-token + curl, so a
        #     straggler retry waits past the minutes-long finalization tail;
        #     falls back to the ACTIVE-state poll if the ops API is unavailable.
        #   - FAIL-LOUD gate: a non-zero firebase exit, or >5 failed functions,
        #     still fails the job (a big failure set = something real is broken,
        #     not 409 noise). The "Notify on failure" step opens a GitHub issue.
        # Enumeration uses `firebase functions:list` (authed via
        # GOOGLE_APPLICATION_CREDENTIALS) to validate straggler names.
        run: |
          # GitHub runs this with `bash -e`; disable errexit so a failing deploy
          # attempt doesn't abort before we read its exit code and retry.
          set +e -uo pipefail
          PROJECT=estate-plan-generator
          REGION=us-east1
          RUNNER_TEMP="${RUNNER_TEMP:-/tmp}"
          FAIL_RE='failed to (update|create) function|unable to queue the operation'

          # Small node helpers, written to files to avoid inline-quoting hell.
          # count-busy: number of functions NOT in ACTIVE state (fallback drain).
          cat > "$RUNNER_TEMP/count-busy.js" <<'JS'
          let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s).result||[];process.stdout.write(String(r.filter(f=>f.state&&f.state!=='ACTIVE').length));}catch(e){process.stdout.write('ERR');}});
          JS
          # count-inflight: number of not-done LROs in a v2 ListOperationsResponse.
          cat > "$RUNNER_TEMP/count-inflight.js" <<'JS'
          let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const o=JSON.parse(s).operations||[];process.stdout.write(String(o.filter(op=>op.done!==true).length));}catch(e){process.stdout.write('ERR');}});
          JS
          # list-default: ids of the `default`-codebase functions, one per line.
          cat > "$RUNNER_TEMP/list-default.js" <<'JS'
          let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s).result||[];for(const f of r){if(f.codebase==='default'&&f.id)console.log(f.id);}}catch(e){}});
          JS

          # gcloud (preinstalled on ubuntu-latest) mints the access tokens for
          # the ops-drain; auth@v3 already wrote the SA key file.
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet \
            || echo "⚠️ gcloud activation failed — drain will use the state-based fallback."

          # Count of in-flight (done=false) Cloud Functions v2 LROs, or ERR.
          # An empty ListOperationsResponse {} parses to 0 (all done).
          inflight_ops() {
            local token
            token=$(gcloud auth print-access-token 2>/dev/null) || { echo ERR; return; }
            curl -sf -m 30 -H "Authorization: Bearer $token" \
              "https://cloudfunctions.googleapis.com/v2/projects/$PROJECT/locations/$REGION/operations?filter=done%3Dfalse&pageSize=100" \
              | node "$RUNNER_TEMP/count-inflight.js"
          }

          # Wait until the regional v2 op-queue has drained so the next batch
          # doesn't 409. Primary signal: ZERO in-flight LROs — this catches the
          # minutes-long finalization tail AFTER a function already serves
          # ACTIVE (the gap that broke the #69 state-based drain). Fallback on
          # ops-query failure: the old ACTIVE-state poll. Both cap and then
          # proceed anyway (the deploy retries absorb a 409 if a cap was short).
          drain() {
            local waited=0 max=900 ops busy
            while [ "$waited" -lt "$max" ]; do
              ops=$(inflight_ops)
              if [ "$ops" = "ERR" ] || [ -z "$ops" ]; then
                sleep 5
                ops=$(inflight_ops)   # one retry — transient token/API hiccup
              fi
              if [ "$ops" = "ERR" ] || [ -z "$ops" ]; then
                echo "   ⚠️ operations API unavailable — falling back to ACTIVE-state drain."
                break
              fi
              if [ "$ops" = "0" ]; then
                [ "$waited" -gt 0 ] && echo "   op-queue drained after ${waited}s."
                return 0
              fi
              echo "   draining op-queue: $ops operation(s) still in flight (${waited}s)…"
              sleep 20; waited=$((waited + 20))
            done
            if [ "$waited" -ge "$max" ]; then
              echo "   ⚠️ drain cap (${max}s) reached; proceeding anyway."
              return 0
            fi
            # Fallback: state-based poll (pre-LRO behavior — better than nothing).
            waited=0; max=360
            while [ "$waited" -lt "$max" ]; do
              busy=$(firebase functions:list --project "$PROJECT" --json 2>/dev/null \
                | node "$RUNNER_TEMP/count-busy.js")
              if [ "$busy" = "0" ]; then
                [ "$waited" -gt 0 ] && echo "   op-queue drained (state-based) after ${waited}s."
                return 0
              fi
              [ "$busy" = "ERR" ] || [ -z "$busy" ] && busy="?"
              echo "   draining (state-based): $busy function(s) still deploying (${waited}s)…"
              sleep 20; waited=$((waited + 20))
            done
            echo "   ⚠️ state-drain cap (${max}s) reached; proceeding anyway."
            return 0
          }

          # Deploy a set of --only targets, draining the op-queue before each
          # attempt so batches don't 409-cascade. Converged = exit 0 AND zero
          # per-function failure lines. Non-zero if it can't converge in $tries.
          deploy_with_retry() {
            local label="$1" targets="$2" tries="$3" pause="${4:-20}" i=1 code fails
            LAST_DEPLOY_CODE=1  # exposed for the straggler pass (exit of last attempt)
            while [ "$i" -le "$tries" ]; do
              drain
              echo "::group::deploy $label — attempt $i/$tries"
              firebase deploy --only "$targets" \
                --project "$PROJECT" --non-interactive --force 2>&1 | tee "deploy-$label-$i.log"
              code=${PIPESTATUS[0]}
              LAST_DEPLOY_CODE=$code
              echo "::endgroup::"
              fails=$(grep -ciE "$FAIL_RE" "deploy-$label-$i.log" || true)
              if [ "$code" -eq 0 ] && [ "$fails" -eq 0 ]; then
                echo "✅ $label converged on attempt $i."
                return 0
              fi
              echo "⚠️ $label attempt $i did not converge (firebase exit=$code, per-function failures=$fails)."
              i=$((i + 1))
              [ "$i" -le "$tries" ] && { echo "Retrying after ${pause}s pause + drain…"; sleep "$pause"; }
            done
            return 1
          }

          # 1. Rules + indexes first — independent of the function op-queue.
          #    firestore:indexes added for the clause-mining vectorConfig
          #    index (additive; existing indexes are never deleted by deploy).
          deploy_with_retry "rules" "firestore:rules,firestore:indexes,storage" 3 || {
            echo "❌ firestore:rules / firestore:indexes / storage failed to deploy."; exit 1; }

          # 2. Enumerate the default-codebase functions — used only to validate
          #    straggler names below. The batched pre-deploy was removed in the
          #    #64 simplification; the single full deploy (step 3) handles the
          #    mass and the straggler pass converges the ~1 loser.
          #    (The 3 dormant backfill-codebase jobs are left to the full deploy.)
          mapfile -t FUNCS < <(firebase functions:list --project "$PROJECT" --json 2>/dev/null \
            | node "$RUNNER_TEMP/list-default.js" | sort -u)
          echo "Discovered ${#FUNCS[@]} default-codebase functions."

          # 3. ONE full deploy — catches new functions, deletes removed ones, and
          #    is the authoritative convergence gate. A single mass update leaves
          #    at most ~1 random 409 straggler on a clean queue (2026-07-02).
          #    tries=1: don't re-run the whole 80-function mass on a straggler —
          #    hand off to the straggler pass, which targets just the loser.
          #
          # 4. STRAGGLER PASS (2026-07-02). Empirically (runs #95/#96), every
          #    mass update of ~80 functions gets EXACTLY ONE random 409 — a
          #    different function each attempt — so "retry the full deploy" can
          #    never reach zero failures. Single-function deploys, by contrast,
          #    succeed essentially always (the burst 409 only hits mass updates;
          #    it was also the reliable manual pattern for weeks). So when the
          #    full deploy fails on a SMALL tail (≤5 functions), parse exactly
          #    which functions failed from the deploy log and deploy each one
          #    individually. Anything larger still fails loud — a big failure set
          #    means something real is broken, not burst-409 noise.
          if ! deploy_with_retry "final" "functions,firestore:rules,firestore:indexes,storage" 1; then
            # Parse failed function names from the deploy attempt; the log is
            # tee'd raw (may carry ANSI codes), so keep only valid name chars.
            mapfile -t STRAGGLERS < <(grep -hoE 'failed to (update|create) function [^ ]+' "deploy-final-1.log" \
              | awk '{print $NF}' | sed 's|.*/functions/||' | grep -oE '^[A-Za-z0-9_-]+' | sort -u)
            in_default() { local f; for f in "${FUNCS[@]}"; do [ "$f" = "$1" ] && return 0; done; return 1; }
            # Only take the straggler shortcut when firebase itself exited 0 on the
            # last attempt — per-function 409s are warning-level (exit stays 0). A
            # non-zero exit means some OTHER failure (e.g. a failed delete or a
            # rules error) that targeted redeploys would mask. Fail loud instead.
            if [ "${LAST_DEPLOY_CODE:-1}" -ne 0 ]; then
              echo "❌ Final deploy exited non-zero (${LAST_DEPLOY_CODE:-?}) — not burst-409 straggler noise. Failing the job."
              exit 1
            fi
            if [ "${#STRAGGLERS[@]}" -ge 1 ] && [ "${#STRAGGLERS[@]}" -le 5 ]; then
              echo "Final deploy left ${#STRAGGLERS[@]} straggler(s): ${STRAGGLERS[*]} — converging individually."
              straggler_failed=0
              for fn in "${STRAGGLERS[@]}"; do
                if ! in_default "$fn"; then
                  echo "❌ Straggler '$fn' is not a known default-codebase function — cannot target it safely."
                  straggler_failed=1; continue
                fi
                # 6 tries spaced ~4 min: run #97 (2026-07-02) showed the invisible
                # per-function blocker behind a burst 409 can outlive the region
                # ops-queue drain AND persist 11+ minutes (createFirmUser) — the
                # old 3 tries × ~20s spanned only ~8 min and lost the race. Every
                # observed blocker cleared well within this ~25-minute window.
                deploy_with_retry "straggler-$fn" "functions:default:$fn" 6 240 || {
                  echo "❌ Straggler '$fn' failed even as a single-function deploy."
                  straggler_failed=1; }
              done
              if [ "$straggler_failed" -ne 0 ]; then
                echo "❌ Straggler pass did NOT converge — functions may be stale. Failing the job."
                exit 1
              fi
              echo "✅ Straggler pass converged the tail; prod matches this build."
            else
              echo "❌ Final full deploy did NOT converge (${#STRAGGLERS[@]} failures — too many for the straggler pass)."
              echo "   Re-run this workflow, or small-batch deploy the stragglers locally:"
              echo "   firebase deploy --only functions:default:a,functions:default:b (≤5 at a time)."
              exit 1
            fi
          fi

          echo "✅ Functions + rules fully converged."
          exit 0

      # Surface CI/deploy failures that would otherwise go unnoticed — commits
      # here are authored by "AI Bot", so GitHub's default failure email doesn't
      # reach Adam (this caused a 4-day silent deploy outage in June 2026).
      # Opens a GitHub issue assigned to Adam on ANY failed step (lint/test/
      # build/deploy); appends to the existing open issue instead of duplicating.
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const wf = context.workflow;
            const sha = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 CI failing: ${wf}`;
            const body = `**${wf}** failed on \`${sha}\` (${context.eventName}).\n\nRun: ${runUrl}\n\nThe deploy did not complete — functions/rules may be stale until this is fixed.`;
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, assignees: ['adameliaslaw'] });
            }
