name: Firebase Functions deploy

# Auto-deploys Cloud Functions to `estate-plan-generator` every time main
# is pushed with functions changes. Replaces the manual
# `firebase deploy --only functions` step that requires
# adam@adameliaslaw.com locally (info@adamelias.ai lacks
# `iam.serviceAccounts.ActAs`).
#
# Uses the SAME GitHub secret as the hosting workflow
# (FIREBASE_SERVICE_ACCOUNT_EPG) — no extra setup needed if hosting CI
# is already wired up.
#
# Firebase will pick up Secret Manager values automatically at deploy
# time (ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, PERPLEXITY_API_KEY,
# SENDGRID_API_KEY, etc.). The CI
# service account needs `roles/secretmanager.secretAccessor` — Firebase's
# default-generated key includes this via `roles/firebase.admin`.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-functions-deploy.yml'
  # Manual trigger for ad-hoc deploys (e.g. after rotating a secret)
  workflow_dispatch:

# Cancel in-flight deploys when a newer commit arrives
concurrency:
  group: functions-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Raised 60→120 after the first real run timed out mid-batch (cancelled at
    # the 60-min ceiling before reaching the final convergence gate). The
    # one-time baseline converge — every function churning from local-build to
    # CI-build — deploys ~70 functions in batches of 5 (~15 firebase
    # invocations), each paying firebase's predeploy build + source upload +
    # analyze overhead (~50s) plus the actual deploy, with 90s retry backoff for
    # 409'd stragglers. Normal PRs change few functions and finish in well under
    # 15 min; the 120 ceiling only matters for the one-time/full-churn converge.
    timeout-minutes: 120
    # contents:read for checkout; issues:write so the failure handler below can
    # open/append a GitHub issue. Deploy auth is via google-github-actions/auth
    # (a SA key), NOT GITHUB_TOKEN, so this restriction doesn't affect the deploy.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies (frozen lockfile)
        working-directory: functions
        run: npm ci

      - name: Type-check + build
        working-directory: functions
        run: npm run build

      # functions-backfill is a second codebase with its own pinned TypeScript.
      # `firebase deploy` runs its predeploy build (npm run build -> tsc) but
      # does NOT install its deps. Without this, tsc resolves to an ambient
      # newer TypeScript that errors on moduleResolution=node10 (TS5107).
      # Installing the locked deps pins it to the same TS as local builds.
      - name: Install functions-backfill dependencies (frozen lockfile)
        working-directory: functions-backfill
        run: npm ci

      # Gate the deploy on the root test suite — it covers the security-rules
      # text, the client-data serializer, and template formatting, so a rules
      # or generator regression aborts the deploy before it ships. The suite
      # needs root deps (vitest/jsdom) on top of the functions deps installed
      # above for the tests that import functions/src.
      - name: Install root dependencies (for the test suite)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPG }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Deploy functions + security rules
        # `google-github-actions/auth@v3` sets GOOGLE_APPLICATION_CREDENTIALS
        # automatically for subsequent steps; firebase-tools picks it up.
        # firestore:rules and storage are included because no other workflow
        # deploys them. Storage was provisioned 2026-06-16 (defaultBucket
        # registered). The CI deployer SA initially still failed the storage
        # setup-check with "Firebase Storage has not been set up": its
        # `defaultBucket` GET returned 404 (not 403) because the SA had only the
        # narrow firebase*.admin roles and lacked `firebase.projects.get`, which
        # firebasestorage needs to resolve the defaultBucket. Fixed by granting
        # the SA `roles/firebase.viewer` (read-only) — verified the GET flips
        # 404->200 under SA impersonation. storage.rules now auto-deploys in CI.
        #
        # CHUNKED DEPLOY (added 2026-06-30, supersedes the retry-the-full-deploy
        # loop). A single `firebase deploy --only functions` of ~70 Cloud
        # Functions v2 deploys them all at once, exceeding the v2 concurrent-op
        # ceiling → updates fail with HTTP 409 "unable to queue the operation".
        # `firebase deploy` logs those as WARNINGS and still EXITS 0, so CI used
        # to report green while ~36 functions silently stayed on old code
        # (stranding T6/T7/AR/T8/#62 — found when a SendGrid smoke test failed).
        # Re-running the *full* deploy never converged (the op-queue cascades:
        # 8→8→4→4→4 failures, 0 successes). What DOES work is deploying in small
        # batches (≤5 functions per invocation succeeds 100% — that's how prod
        # was converged by hand). So we now:
        #   1. deploy firestore:rules + storage once,
        #   2. enumerate the deployed function names and redeploy them in batches
        #      of 5 (with per-batch retries),
        #   3. run a final full `firebase deploy --only functions` — it catches
        #      brand-new functions not yet in the project and deletes any removed
        #      from code; everything converged in step 2 is unchanged → skipped →
        #      no 409 storm. This final deploy is the authoritative convergence
        #      gate: we FAIL the job if it reports any per-function failure, which
        #      trips the "Notify on failure" issue below.
        run: |
          # GitHub runs this with `bash -e`; disable errexit so a failing deploy
          # attempt doesn't abort before we read its exit code and retry.
          set +e -uo pipefail
          PROJECT=estate-plan-generator
          CHUNK_SIZE=5
          FAIL_RE='failed to (update|create) function|unable to queue the operation'

          # Deploy a set of --only targets with retries. Converged = exit 0 AND
          # zero per-function failure lines in the log. Returns non-zero if it
          # can't converge within $tries attempts.
          deploy_with_retry() {
            local label="$1" targets="$2" tries="$3" i=1 code fails
            while [ "$i" -le "$tries" ]; do
              echo "::group::deploy $label — attempt $i/$tries"
              firebase deploy --only "$targets" \
                --project "$PROJECT" --non-interactive --force 2>&1 | tee "deploy-$label-$i.log"
              code=${PIPESTATUS[0]}
              echo "::endgroup::"
              fails=$(grep -ciE "$FAIL_RE" "deploy-$label-$i.log" || true)
              if [ "$code" -eq 0 ] && [ "$fails" -eq 0 ]; then
                echo "✅ $label converged on attempt $i."
                return 0
              fi
              echo "⚠️ $label attempt $i did not converge (firebase exit=$code, per-function failures=$fails)."
              i=$((i + 1))
              if [ "$i" -le "$tries" ]; then
                # 90s (not 30s): a 409 "unable to queue the operation" means an
                # operation is already in flight on that function; retrying before
                # it settles just 409s again. Give it time to clear.
                echo "Retrying in 90s (firebase skips already-converged functions)…"
                sleep 90
              fi
            done
            return 1
          }

          # 1. Rules first — independent of the function op-queue.
          deploy_with_retry "rules" "firestore:rules,storage" 3 || {
            echo "❌ firestore:rules / storage failed to deploy."; exit 1; }

          # 2. Redeploy every currently-deployed function in small batches.
          #    gcloud `value(name)` returns the full resource path for gen2
          #    functions; strip to the short name (basename).
          mapfile -t FUNCS < <(gcloud functions list --project "$PROJECT" \
            --format="value(name)" 2>/dev/null | sed -E 's#.*/##' | grep -v '^$' | sort -u)
          echo "Discovered ${#FUNCS[@]} deployed functions; converging in batches of $CHUNK_SIZE."
          if [ "${#FUNCS[@]}" -eq 0 ]; then
            echo "⚠️ gcloud returned 0 functions — skipping batches, relying on the final full deploy."
          fi
          batch_warned=0
          i=0
          while [ "$i" -lt "${#FUNCS[@]}" ]; do
            chunk=("${FUNCS[@]:i:CHUNK_SIZE}")
            targets=$(printf 'functions:%s,' "${chunk[@]}"); targets=${targets%,}
            n=$((i / CHUNK_SIZE + 1))
            echo "Batch $n: ${chunk[*]}"
            deploy_with_retry "batch-$n" "$targets" 3 || {
              echo "⚠️ Batch $n did not converge after retries — the final full deploy will pick up its stragglers."
              batch_warned=1; }
            i=$((i + CHUNK_SIZE))
          done

          # 3. Final full deploy — catches new functions, deletes removed ones,
          #    and is the authoritative convergence gate. After step 2 the
          #    existing functions are unchanged (same build) → skipped → no storm.
          deploy_with_retry "final" "functions,firestore:rules,storage" 5 || {
            echo "❌ Final full deploy did NOT converge — functions may be stale. Failing the job."
            echo "   Re-run this workflow, or small-batch deploy the stragglers locally:"
            echo "   firebase deploy --only functions:a,functions:b (≤5 at a time)."
            exit 1; }

          if [ "$batch_warned" -ne 0 ]; then
            echo "ℹ️ One or more batches needed the final deploy to converge, but the final"
            echo "   deploy reported 0 per-function failures, so prod is current."
          fi
          echo "✅ Functions + rules fully converged."
          exit 0

      # Surface CI/deploy failures that would otherwise go unnoticed — commits
      # here are authored by "AI Bot", so GitHub's default failure email doesn't
      # reach Adam (this caused a 4-day silent deploy outage in June 2026).
      # Opens a GitHub issue assigned to Adam on ANY failed step (lint/test/
      # build/deploy); appends to the existing open issue instead of duplicating.
      #
      # `cancelled()` is included so a job TIMEOUT also pages: GitHub marks a
      # timed-out job `cancelled`, not `failure`, so a bare `if: failure()` would
      # let a deploy that ran out of time exit silently (this happened on the
      # first chunked run — cancelled at 60 min before the convergence gate, with
      # no alert). A concurrency-cancel (a newer push superseding this run) will
      # also land here, but that's rare for this workflow and a spurious page is
      # far cheaper than a missed timeout — this project's recurring failure mode
      # is silent non-completion, so we err toward alerting.
      - name: Notify on failure
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const wf = context.workflow;
            const sha = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 CI failing: ${wf}`;
            const body = `**${wf}** did not complete on \`${sha}\` (${context.eventName}) — failed or timed out.\n\nRun: ${runUrl}\n\nThe deploy did not finish — functions/rules may be stale until this is re-run.`;
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, assignees: ['adameliaslaw'] });
            }
