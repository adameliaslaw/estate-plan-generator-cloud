name: Firebase Hosting deploy

# Auto-deploys the frontend to https://estate-plan-generator.web.app
# every time main is pushed. Replaces the manual
# `npm run build && firebase deploy --only hosting` step that requires
# adam@adameliaslaw.com locally.
#
# ONE-TIME SETUP (do this once, then never again):
#   1. Firebase Console → Project Settings → Service Accounts → Generate
#      new private key. Download the JSON.
#   2. GitHub repo → Settings → Secrets and variables → Actions →
#      New repository secret:
#        Name:  FIREBASE_SERVICE_ACCOUNT_EPG
#        Value: paste the JSON (entire file contents, single line or
#               multi-line both work)
#   3. The next push to main triggers the first auto-deploy.
#
# After that, this workflow handles every hosting deploy on every merge
# to main with zero local CLI calls.

on:
  push:
    branches: [main]
    paths:
      # Only run when frontend or hosting config actually changes
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting-deploy.yml'
  # Manual trigger via Actions UI for ad-hoc deploys
  workflow_dispatch:

# Cancel in-flight deploys when a newer commit arrives
concurrency:
  group: hosting-deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents:read for checkout; issues:write so the failure handler below can
    # open/append a GitHub issue. Deploy auth is via google-github-actions/auth
    # with the FIREBASE_SERVICE_ACCOUNT_EPG SA key (credentials_json, not WIF —
    # so no id-token permission is needed).
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      # The root vitest suite imports some functions/src modules (serializer,
      # template engine), which pull in firebase-admin/openai — those must be
      # installed for the suite to resolve them.
      - name: Install functions dependencies (for the test suite)
        run: npm ci --prefix functions

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Type-check + build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyCMSjBKJ4vr8zXTPk2lpNNDWgCG4AR88oo
          VITE_FIREBASE_AUTH_DOMAIN: estate-plan-generator.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: estate-plan-generator
          VITE_FIREBASE_STORAGE_BUCKET: estate-plan-generator.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "749324460027"
          VITE_FIREBASE_APP_ID: 1:749324460027:web:410d9c51785e6c0dd8b55e
          VITE_USE_EMULATORS: "false"
          # Public OAuth client ID (baked into the client bundle; matches the
          # backend GOOGLE_CLIENT_ID secret). Without this, Settings →
          # Integrations renders "Missing VITE_GOOGLE_CLIENT_ID" and the
          # Google Calendar/Drive connect buttons don't work. Was absent here,
          # so every CI hosting deploy stripped it from the bundle.
          VITE_GOOGLE_CLIENT_ID: 749324460027-donln8vkprbol5uk7hhui19fbnc7ff7j.apps.googleusercontent.com

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPG }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Deploy to Firebase Hosting (live channel)
        # Mirrors the (reliably green) functions workflow's auth path. The old
        # FirebaseExtended/action-hosting-deploy@v0 exited non-zero on transient
        # googleapis keep-alive resets ("premature close") even when the release
        # actually succeeded, and hard-failed re-runs of unchanged content with
        # "supplied version … is the current active version". google-github-
        # actions/auth@v3 sets GOOGLE_APPLICATION_CREDENTIALS automatically;
        # firebase-tools picks it up. `firebase deploy --only hosting` tolerates
        # unchanged content gracefully.
        run: firebase deploy --only hosting --project estate-plan-generator --non-interactive

      # Surface CI/deploy failures that would otherwise go unnoticed — commits
      # here are authored by "AI Bot", so GitHub's default failure email doesn't
      # reach Adam. Opens a GitHub issue assigned to Adam on ANY failed step;
      # appends to the existing open issue instead of duplicating.
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const wf = context.workflow;
            const sha = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 CI failing: ${wf}`;
            const body = `**${wf}** failed on \`${sha}\` (${context.eventName}).\n\nRun: ${runUrl}\n\nThe deploy did not complete — the live site may be stale until this is fixed.`;
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, assignees: ['adameliaslaw'] });
            }
